name: CI
# Vault GitHub-Actions-Patterns.md § Rust, except the Format step: this repo has never been
# formatted as a whole, so `cargo fmt --check` would fail on untouched code (AGENTS.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6   # v2.9.2
      - name: Build
        run: cargo build --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad   # v2.87.26
        with:
          tool: cargo-deny@0.20.2
      - name: Dependencies (advisories, licences, bans, sources)
        run: cargo deny check
